# DSH 适配中台 · 云原生构建流水线
#
# 设计要点（对应需求「跟着官方文档和新版本做适配」）：
# 1. push / PR：离线单测 + **stable 与 dev 双通道真宿主验收**（legacy 走 crontab 周检，省额度）；
#    **push / PR 只「读」契约基线**，绝不写 —— 每次 push 都改基线 = 基线自己一直在动，
#    上游连续发版时的累积偏移会被静默吸收（issue 里点名的「三个通道 + 不同基线 ⇒ 大量问题」）。
# 2. crontab：① **每日 10:00 结算基线**（一天一个基线，唯一写基线的地方）；
#    ② 每日侦测上游 dist-tag 漂移（越不稳定越需要自动化侦测）；
# 3. web_trigger / web_trigger_watch：页面上给按钮，人不用记命令。
main:
  push:
    - name: offline-unit
      docker:
        image: node:22
      stages:
        - name: offline-tests
          script: |
            bash tests/test_offline.sh
        - name: exports-selfcheck
          script: |
            # 发布面自检：exports 全解析 + 文档 import 路径 + 模板拷贝可用（防同类回归）
            node tests/test_exports.mjs
        - name: attribution-offline
          script: |
            # 归因离线回归：契约采集无残留（🔴-A）+ 判据结构化（🔴-B）+ CLI 契约
            node tests/test_attribution.mjs
        - name: baseline-readonly
          script: |
            # 契约基线「分段 + 只读」守卫（issue 口径）：
            # ① verify 不得写基线（push 只读）；② push/PR 段不得出现写基线的命令；
            # ③ 基线链可读且与分片一致（`settle` 是唯一写入点，且在 crontab 里）。
            node tests/test_baseline_guard.mjs
    - name: dual-channel-verify
      docker:
        image: node:22
      stages:
        - name: stable-channel
          script: |
            # 稳定版通道：失败 = 插件回归，必须修
            node src/cli.mjs verify --channel stable \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-stable.json --markdown
        - name: dev-channel
          script: |
            # 开发版通道：越不稳定越要跑；失败时归因区分「上游漂移 / 插件回归」
            node src/cli.mjs verify --channel dev \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-dev.json --markdown
        - name: guardrail-negative
          script: |
            # 负例：违反宿主硬约束的插件必须被拦下，**且归因必须是插件侧**
            # （只看退出码不够：AMBER 漂移窗口内负例也会 fail，闸门会静默失效）
            if node src/cli.mjs verify --channel stable \
                 --plugin ./tests/fixtures/broken-plugin.mjs \
                 --tools broken_ok --json ./.ci/verify-broken.json; then
              echo "❌ 负例插件被误判为通过：护栏失效"; exit 1
            fi
            node -e '
              const r = require("./.ci/verify-broken.json");
              const c = r.channels[0];
              const guard = (c.checks || []).find((x) => x.name === "guard.reserved_rejected");
              const bad = [];
              if (!guard || guard.status !== "fail") bad.push("失败项不是 guard.reserved_rejected");
              if (c.attribution !== "PLUGIN_REGRESSION") bad.push("归因不是 PLUGIN_REGRESSION（实得 " + c.attribution + "）");
              if (r.summary.verdict === "AMBER") bad.push("判决为 AMBER（负例被归因成上游漂移）");
              if (bad.length) { console.error("❌ 负例闸门失败：" + bad.join("；")); process.exit(1); }
              console.log("✅ 负例插件被正确拦下，且归因为 PLUGIN_REGRESSION（verdict=" + r.summary.verdict + "）");
            '
        - name: attribution-e2e
          script: |
            # 归因端到端回归（真宿主）：上游取消保留名 → GREEN 且记漂移；
            # 插件 apply 抛错 / 语法错误 / 缺 apply / 多余工具 → PLUGIN_REGRESSION；
            # 漂移窗口 + 插件声明保留名 → 仍 PLUGIN_REGRESSION（🔴-C 原始复现）；
            # hub 路径含 npm 不得翻案（🔴-A / 🔴-B 原始复现场景）
            node tests/test_e2e_regression.mjs
        - name: plugin-error-not-host-signal
          script: |
            # 🔴-D / 🔴 必修-2/3 闸门：插件侧错误**不得**进判据字段 hostFatal[]。
            # ⚠️ 口径前提（v0.1.9b 收窄，评审复评 H1）：以「探针进程内防线未被插件干预」为前提——
            #    插件可 setUncaughtExceptionCaptureCallback() 静音防线（放行级假绿），见 docs/RISKS.md R22/R23。
            # 四条出口（同步 / 异步 / 进程 exit / run() 被拖住）+ 不可捕获边界（SIGKILL）
            # + 侧信道（🆕 nonce：伪造 __DSH_PROBE__ 绿卡 → 判 plugin.probe_result_forged）
            # + **防过度修正**（健康插件仍须 17/17 GREEN）。
            # 断言口径（🟡-3）：逐夹具断言**完整失败项集合**（多一条噪音失败也红），
            # 不再只断「含期望项」——后者会静默放行夹具退化出的额外失败。
            #
            # 口径与夹具清单的唯一事实源是 tests/gate_plugin_side.sh —— push 段与 PR 段
            # **共用同一份**（评审 🟢 重复项：此前两段各自维护，54 行差异 ⇒ 迟早一处加了
            # 夹具、另一处忘了，闸门静默失效）。
            #
            # 出口④ 的回归加速：宿主侧**缩短**看门狗窗口（探针只许缩短、不许延长）。
            DSH_PROBE_RUN_WATCHDOG_MS=5000 bash tests/gate_plugin_side.sh
    - name: upstream-watch
      docker:
        image: node:22
      stages:
        - name: watch-dist-tags
          script: |
            # 上游有新版本时退出码 1：不阻断主干（漂移不是错误，是信号），但显式可见
            node src/cli.mjs watch --json ./.ci/watch.json || true
            cat ./.ci/watch.json
  pull_request:
    - name: offline-unit
      docker:
        image: node:22
      stages:
        - name: offline-tests
          script: |
            bash tests/test_offline.sh
        - name: exports-selfcheck
          script: |
            node tests/test_exports.mjs
        - name: attribution-offline
          script: |
            node tests/test_attribution.mjs
    - name: dual-channel-verify
      docker:
        image: node:22
      stages:
        - name: stable-channel
          script: |
            node src/cli.mjs verify --channel stable \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-stable.json --markdown
        - name: dev-channel
          script: |
            node src/cli.mjs verify --channel dev \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-dev.json --markdown
        - name: legacy-guard
          script: |
            # 防「为适配新版把旧版装崩」
            node src/cli.mjs verify --channel legacy \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-legacy.json --markdown
        - name: attribution-e2e
          script: |
            # 归因端到端回归（含 🔴-C 漂移窗口不吞插件硬违规）
            node tests/test_e2e_regression.mjs
        - name: plugin-error-not-host-signal
          script: |
            # 🔴-D / 🔴 必修-2/3 闸门（同 push 段，**同一份脚本**）：
            # 四条出口 + 不可捕获边界 + 🆕 侧信道（nonce 伪造）+ 完整失败项集合 + 防过度修正（健康插件 17/17）。
            DSH_PROBE_RUN_WATCHDOG_MS=5000 bash tests/gate_plugin_side.sh
  # ★ 每日结算契约基线（10:00）：一天一个基线，**唯一写基线的地方**。
  # 为什么是 10 点：用户点名「早晨 10 点，很多时候这时候都是不用的」——把写基线的动作
  # 放在没人用仓库的时段，且**不跟** push / PR（否则基线被每一次 push 顶上，漂移被静默吸收）。
  # 语义：同周期多次运行**取相对早的那个**当基线；每周期独立分片，不合并到主线。
  #
  # 🚦 **条件触发（不是每天都结算）**：
  #   每日基线**不是必然触发**——有些日子上游没发版、契约没变，那就**不改基线、也不新增站台**。
  #   判据：本次候选 vs 当前基线（链式合并后）的契约指纹，逐键相同 ⇒ 跳过（不落盘、不多一站）。
  #   实现用两段：① `settle --changed-only` 只判不写（exit 1 = 有变化）；② `changed=1` 才真结算。
  #   空跑的那些日期不留站台 ⇒ 「地铁线路图」上只出现**真有声明**的日期。
  "crontab: 0 10 * * *":
    - name: settle-contract-baseline
      docker:
        image: node:22
      stages:
        - name: settle
          script: |
            # 结算输入是最近一次验收报告（这里按「当天先跑一次双通道验收」的口径，
            # 验收产物由 CI 在 push 段产出；crontab 段独立跑一份，保证不依赖上一次 push）
            node src/cli.mjs verify --channel all \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-settle.json --markdown || true
            # 条件门：契约没变化就不做（exit 1 = 有变化）；同一份报告既当候选又当比对面
            node src/cli.mjs settle --from ./.ci/verify-settle.json --changed-only || CHANGED=1
            if [ "${CHANGED:-0}" != "1" ]; then
              echo "⏭ 基线未变化：跳过结算（不改基线、不新增站台）——每日基线为条件触发"
              node src/cli.mjs baseline --markdown
              exit 0
            fi
            # ★ 唯一写基线的地方：一天一个基线（周期键 = 当日结算点日期）
            node src/cli.mjs settle --from ./.ci/verify-settle.json --mode day --markdown
            # 链式合并后的当前基线（早 → 晚顺序合并，「连起来」才是最新版）
            node src/cli.mjs baseline --markdown
  # 每日侦测上游漂移（Asia/Shanghai 03:30；最小调度间隔 5 分钟）
  "crontab: 30 3 * * *":
    - name: upstream-drift-scan
      docker:
        image: node:22
      stages:
        - name: watch
          script: |
            # 上游漂移侦测 + **自动归因影响面**：把「有没有漂移」推到
            # 「漂移到哪（契约字段）→ 影响哪些检查 → 中台改哪一处 → 插件要不要动」。
            # 退出码 1 = 有漂移（版本或契约），显式可见；不阻断（漂移是信号，不是错误）。
            node src/cli.mjs watch --json ./.ci/watch.json --markdown
        - name: legacy-weekly
          script: |
            # 历史线周检：仅周日跑 legacy 全量验收，避免每日消耗
            if [ "$(date +%u)" = "7" ]; then
              node src/cli.mjs verify --channel legacy \
                --plugin ./tests/fixtures/demo-plugin.mjs \
                --tools demo_echo,demo_status \
                --json ./.ci/verify-legacy.json --markdown
            else
              echo "非周日，跳过 legacy 全量验收"
            fi
# 页面手动触发（按钮定义见 .cnb/web_trigger.yml；事件名必须与此处一致）
$:
  web_trigger:
    - name: manual-dual-channel
      docker:
        image: node:22
      stages:
        - name: dual-channel
          script: |
            # CHANNEL 由页面按钮传入：both(默认) / stable / dev / all
            # 语义与 CLI 的 --channel 完全一致（all = stable+dev+legacy）
            case "$CHANNEL" in
              stable) CHANNELS="stable" ;;
              dev) CHANNELS="dev" ;;
              all) CHANNELS="stable dev legacy" ;;
              *) CHANNELS="stable dev" ;;
            esac
            FAIL=0
            for ch in $CHANNELS; do
              echo "==== 通道 $ch ===="
              node src/cli.mjs verify --channel "$ch" --plugin "$PLUGIN_PATH" --tools "$TOOLS" --markdown || FAIL=1
            done
            exit $FAIL
  web_trigger_settle:
    - name: manual-settle-baseline
      docker:
        image: node:22
      stages:
        - name: settle
          script: |
            # 页面按钮「结算契约基线」：★ 唯一写基线的地方（人手动触发时用）
            # CHANNEL 语义与 CLI 的 --channel 一致；SETTLE_MODE 支持一次跑成 --dry-run 演练
            ARGS="--mode $SETTLE_MODE"
            if [ "$SETTLE_MODE" = "release" ] && [ -n "$RELEASE_ID" ]; then ARGS="$ARGS --release $RELEASE_ID"; fi
            if [ "$DRY_RUN" = "yes" ]; then ARGS="$ARGS --dry-run"; fi
            node src/cli.mjs verify --channel all --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status --json ./.ci/verify-settle.json --markdown || true
            # 条件触发：没变化就不做（除非显式 FORCE=yes 强制落一版站台）
            if [ "$FORCE" != "yes" ]; then
              node src/cli.mjs settle --from ./.ci/verify-settle.json --changed-only || CHANGED=1
              if [ "${CHANGED:-0}" != "1" ]; then
                echo "⏭ 基线未变化：跳过结算（页面按钮同样按条件触发）"
                node src/cli.mjs baseline --markdown
                exit 0
              fi
            fi
            # shellcheck disable=SC2086
            node src/cli.mjs settle --from ./.ci/verify-settle.json $ARGS --markdown
            node src/cli.mjs baseline --markdown
  web_trigger_watch:
    - name: manual-upstream-watch
      docker:
        image: node:22
      stages:
        - name: watch
          script: |
            # 页面按钮「上游漂移侦测」：先打人类视图（影响面 + 改哪一处），再留机器可读 JSON
            node src/cli.mjs watch --json ./.ci/watch.json --markdown || true
            node -e 'const r=require("./.ci/watch.json");console.log(JSON.stringify({hasDrift:r.triage.hasDrift,hubFiles:r.triage.hubFiles,plugins:r.triage.plugins},null,2))'
