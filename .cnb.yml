# DSH 适配中台 · 云原生构建流水线
#
# 设计要点（对应需求「跟着官方文档和新版本做适配」）：
# 1. push / PR：离线单测 + **stable 与 dev 双通道真宿主验收**（legacy 走 crontab 周检，省额度）；
# 2. crontab：每日侦测上游 dist-tag 漂移（越不稳定越需要自动化侦测）；
# 3. web_trigger / web_trigger_watch：页面上给两个按钮，人不用记命令。
main:
  push:
    - name: offline-unit
      docker:
        image: node:22
      stages:
        - name: offline-tests
          script: |
            bash tests/test_offline.sh
        - name: exports-selfcheck
          script: |
            # 发布面自检：exports 全解析 + 文档 import 路径 + 模板拷贝可用（防同类回归）
            node tests/test_exports.mjs
        - name: attribution-offline
          script: |
            # 归因离线回归：契约采集无残留（🔴-A）+ 判据结构化（🔴-B）+ CLI 契约
            node tests/test_attribution.mjs
    - name: dual-channel-verify
      docker:
        image: node:22
      stages:
        - name: stable-channel
          script: |
            # 稳定版通道：失败 = 插件回归，必须修
            node src/cli.mjs verify --channel stable \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-stable.json --markdown
        - name: dev-channel
          script: |
            # 开发版通道：越不稳定越要跑；失败时归因区分「上游漂移 / 插件回归」
            node src/cli.mjs verify --channel dev \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-dev.json --markdown
        - name: guardrail-negative
          script: |
            # 负例：违反宿主硬约束的插件必须被拦下，**且归因必须是插件侧**
            # （只看退出码不够：AMBER 漂移窗口内负例也会 fail，闸门会静默失效）
            if node src/cli.mjs verify --channel stable \
                 --plugin ./tests/fixtures/broken-plugin.mjs \
                 --tools broken_ok --json ./.ci/verify-broken.json; then
              echo "❌ 负例插件被误判为通过：护栏失效"; exit 1
            fi
            node -e '
              const r = require("./.ci/verify-broken.json");
              const c = r.channels[0];
              const guard = (c.checks || []).find((x) => x.name === "guard.reserved_rejected");
              const bad = [];
              if (!guard || guard.status !== "fail") bad.push("失败项不是 guard.reserved_rejected");
              if (c.attribution !== "PLUGIN_REGRESSION") bad.push("归因不是 PLUGIN_REGRESSION（实得 " + c.attribution + "）");
              if (r.summary.verdict === "AMBER") bad.push("判决为 AMBER（负例被归因成上游漂移）");
              if (bad.length) { console.error("❌ 负例闸门失败：" + bad.join("；")); process.exit(1); }
              console.log("✅ 负例插件被正确拦下，且归因为 PLUGIN_REGRESSION（verdict=" + r.summary.verdict + "）");
            '
        - name: attribution-e2e
          script: |
            # 归因端到端回归（真宿主）：上游取消保留名 → GREEN 且记漂移；
            # 插件 apply 抛错 / 语法错误 / 缺 apply / 多余工具 → PLUGIN_REGRESSION；
            # 漂移窗口 + 插件声明保留名 → 仍 PLUGIN_REGRESSION（🔴-C 原始复现）；
            # hub 路径含 npm 不得翻案（🔴-A / 🔴-B 原始复现场景）
            node tests/test_e2e_regression.mjs
        - name: plugin-error-not-host-signal
          script: |
            # 🔴-D 闸门：插件写错代码（未初始化类字段 / 抛错 getter）→ 必须判插件，
            # 且 hostFatal[] 必须为空（插件侧错误**永远**不进判据字段）。
            # 只看 attribution 不够：AMBER 漂移窗口下也可能 fail，必须同时断言 hostFatal 为空。
            for fixture in plugin-side-throw-plugin plugin-registry-throw-plugin; do
              if node src/cli.mjs verify --channel stable \
                   --plugin ./tests/fixtures/$fixture.mjs \
                   --tools demo_echo --json ./.ci/verify-$fixture.json; then
                echo "❌ $fixture 被误判为通过"; exit 1
              fi
              node -e '
                const file = process.argv[1];
                const r = require(file);
                const c = r.channels[0];
                const bad = [];
                if (c.attribution !== "PLUGIN_REGRESSION") bad.push("归因不是 PLUGIN_REGRESSION（实得 " + c.attribution + "）");
                if ((c.hostFatal || []).length !== 0) bad.push("hostFatal 非空（插件侧错误写进了判据字段）：" + JSON.stringify(c.hostFatal));
                if (r.summary.verdict === "AMBER") bad.push("判决为 AMBER（插件 bug 被甩给上游）");
                if (bad.length) { console.error("❌ 🔴-D 闸门失败：" + bad.join("；")); process.exit(1); }
                console.log("✅ " + file + "：PLUGIN_REGRESSION / hostFatal 为空 / verdict=" + r.summary.verdict);
              ' ./.ci/verify-$fixture.json
            done
    - name: upstream-watch
      docker:
        image: node:22
      stages:
        - name: watch-dist-tags
          script: |
            # 上游有新版本时退出码 1：不阻断主干（漂移不是错误，是信号），但显式可见
            node src/cli.mjs watch --json ./.ci/watch.json || true
            cat ./.ci/watch.json
  pull_request:
    - name: offline-unit
      docker:
        image: node:22
      stages:
        - name: offline-tests
          script: |
            bash tests/test_offline.sh
        - name: exports-selfcheck
          script: |
            node tests/test_exports.mjs
        - name: attribution-offline
          script: |
            node tests/test_attribution.mjs
    - name: dual-channel-verify
      docker:
        image: node:22
      stages:
        - name: stable-channel
          script: |
            node src/cli.mjs verify --channel stable \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-stable.json --markdown
        - name: dev-channel
          script: |
            node src/cli.mjs verify --channel dev \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-dev.json --markdown
        - name: legacy-guard
          script: |
            # 防「为适配新版把旧版装崩」
            node src/cli.mjs verify --channel legacy \
              --plugin ./tests/fixtures/demo-plugin.mjs \
              --tools demo_echo,demo_status \
              --json ./.ci/verify-legacy.json --markdown
        - name: attribution-e2e
          script: |
            # 归因端到端回归（含 🔴-C 漂移窗口不吞插件硬违规）
            node tests/test_e2e_regression.mjs
        - name: plugin-error-not-host-signal
          script: |
            # 🔴-D 闸门（同 push）：插件侧异常不得进 hostFatal[]
            for fixture in plugin-side-throw-plugin plugin-registry-throw-plugin; do
              node src/cli.mjs verify --channel stable \
                --plugin ./tests/fixtures/$fixture.mjs \
                --tools demo_echo --json ./.ci/verify-$fixture.json && { echo "❌ $fixture 被误判为通过"; exit 1; }
              node -e '
                const r = require(process.argv[1]);
                const c = r.channels[0];
                if (c.attribution !== "PLUGIN_REGRESSION" || (c.hostFatal || []).length !== 0) {
                  console.error("❌ 🔴-D 闸门失败：" + c.attribution + " / hostFatal=" + JSON.stringify(c.hostFatal));
                  process.exit(1);
                }
                console.log("✅ " + process.argv[1] + "：PLUGIN_REGRESSION / hostFatal 为空");
              ' ./.ci/verify-$fixture.json
            done
        - name: attribution-e2e
          script: |
            node tests/test_e2e_regression.mjs
  # 每日侦测上游漂移（Asia/Shanghai 03:30；最小调度间隔 5 分钟）
  "crontab: 30 3 * * *":
    - name: upstream-drift-scan
      docker:
        image: node:22
      stages:
        - name: watch
          script: |
            # 上游漂移侦测 + **自动归因影响面**：把「有没有漂移」推到
            # 「漂移到哪（契约字段）→ 影响哪些检查 → 中台改哪一处 → 插件要不要动」。
            # 退出码 1 = 有漂移（版本或契约），显式可见；不阻断（漂移是信号，不是错误）。
            node src/cli.mjs watch --json ./.ci/watch.json --markdown
        - name: legacy-weekly
          script: |
            # 历史线周检：仅周日跑 legacy 全量验收，避免每日消耗
            if [ "$(date +%u)" = "7" ]; then
              node src/cli.mjs verify --channel legacy \
                --plugin ./tests/fixtures/demo-plugin.mjs \
                --tools demo_echo,demo_status \
                --json ./.ci/verify-legacy.json --markdown
            else
              echo "非周日，跳过 legacy 全量验收"
            fi
# 页面手动触发（按钮定义见 .cnb/web_trigger.yml；事件名必须与此处一致）
$:
  web_trigger:
    - name: manual-dual-channel
      docker:
        image: node:22
      stages:
        - name: dual-channel
          script: |
            # CHANNEL 由页面按钮传入：both(默认) / stable / dev / all
            # 语义与 CLI 的 --channel 完全一致（all = stable+dev+legacy）
            case "$CHANNEL" in
              stable) CHANNELS="stable" ;;
              dev) CHANNELS="dev" ;;
              all) CHANNELS="stable dev legacy" ;;
              *) CHANNELS="stable dev" ;;
            esac
            FAIL=0
            for ch in $CHANNELS; do
              echo "==== 通道 $ch ===="
              node src/cli.mjs verify --channel "$ch" --plugin "$PLUGIN_PATH" --tools "$TOOLS" --markdown || FAIL=1
            done
            exit $FAIL
  web_trigger_watch:
    - name: manual-upstream-watch
      docker:
        image: node:22
      stages:
        - name: watch
          script: |
            # 页面按钮「上游漂移侦测」：先打人类视图（影响面 + 改哪一处），再留机器可读 JSON
            node src/cli.mjs watch --json ./.ci/watch.json --markdown || true
            node -e 'const r=require("./.ci/watch.json");console.log(JSON.stringify({hasDrift:r.triage.hasDrift,hubFiles:r.triage.hubFiles,plugins:r.triage.plugins},null,2))'
